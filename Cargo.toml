[package]
name = "krylov"
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
description = "Matrix-free Krylov methods over user-defined vector types (Lanczos and Arnoldi eigensolvers, Golub-Kahan-Lanczos SVD, CG/GMRES linear solvers, exponential integrators), modelled on KrylovKit.jl"
repository = "https://github.com/Ryo-wtnb11/krylov-rs"
readme = "README.md"
keywords = ["krylov", "lanczos", "eigenvalues", "linear-algebra", "tensor-network"]
categories = ["mathematics", "science", "algorithms"]
exclude = ["AGENTS.md", ".github"]

[dependencies]
colmat = { version = "=0.34.0", default-features = false, features = ["std", "linalg"] }
num-complex = "0.4.6"
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }

[dev-dependencies]
nalgebra = "0.35.0"
